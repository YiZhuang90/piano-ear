<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 钢琴手演示</title>
<style>
body{margin:0;font:16px/1.5 system-ui,"Noto Sans SC",sans-serif;background:#f4f1ea;color:#141518}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.stage{background:#2b2420;border-radius:16px;padding:12px}
.kb{position:relative;display:flex;height:clamp(130px,22vw,190px);margin-bottom:90px}
.wk{flex:1;margin:0 1px;background:#f6f4ef;border-radius:0 0 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:13px;color:#5a5650}
.wk.on{background:#ffd9df}
.bk{position:absolute;top:0;width:calc(100%/12*0.62);height:60%;transform:translateX(-50%);background:linear-gradient(#2e3036,#0d0e10);border-radius:0 0 5px 5px;z-index:2}
.ov{position:absolute;left:0;right:0;top:0;bottom:-90px;pointer-events:none;z-index:3}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid #c9c3b8;background:#fff}
#msg{margin-top:8px;color:#6b665e}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="wrap">
  <h1>3D 钢琴手</h1>
  <div class="stage"><div class="kb" id="kb"></div></div>
  <div class="row">
    <button data-a="4">C 位（拇指在中央 C）</button><button data-a="5">D 位</button><button data-a="7">F 位</button><button data-a="1">低音 G 位</button>
  </div>
  <div class="row">
    <button data-h="1">1</button><button data-h="2">2</button><button data-h="3">3</button><button data-h="4">4</button><button data-h="5">5</button>
    <button id="scale">弹 1-2-3-4-5-4-3-2-1</button>
  </div>
  <div id="msg">加载中…</div>
</div>
<script type="module">
import { PianoHand } from './piano-hand.js';
const NAMES = ['F', 'G', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];
const kb = document.getElementById('kb');
kb.innerHTML = NAMES.map(n => `<div class="wk">${n}</div>`).join('') + [1, 2, 3, 5, 6, 8, 9, 10].map(i => `<div class="bk" style="left:${i / 12 * 100}%"></div>`).join('') + '<div class="ov" id="ov"></div>';
const wks = [...kb.querySelectorAll('.wk')];
let anchor = 4;
const mark = f => { wks.forEach((w, i) => w.classList.toggle('on', f && i === anchor + f - 1)); };
try {
  const hand = await PianoHand.create({ container: document.getElementById('ov'), whiteKeys: 12, keyboardHeight: () => kb.clientHeight });
  window.hand = hand;
  document.getElementById('msg').textContent = '点手位换位置，点数字让那根手指准备好，再点一次按下去。';
  let hl = null;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { anchor = +b.dataset.a; hand.moveTo(anchor); mark(hl); });
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const f = +b.dataset.h; if (hl === f) { hand.press(f); hl = null; hand.highlight(null); mark(null); } else { hl = f; hand.highlight(f); mark(f); } });
  document.getElementById('scale').onclick = () => { hl = null; hand.highlight(null); mark(null); [1, 2, 3, 4, 5, 4, 3, 2, 1].forEach((f, i) => hand.play(f, { delay: 0.3 + i * 0.42, duration: 0.38 })); };
} catch (e) { document.getElementById('msg').textContent = '3D 手加载失败：' + e.message; }
</script>
</body>
</html>
